<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="page">
    <h1>To-Do</h1>

    <form id="add-form" class="card add-form" aria-label="Add task" novalidate>
      <div class="field">
        <label for="add-title">Title</label>
        <input id="add-title" type="text" maxlength="200" autocomplete="off" data-key="add-title">
      </div>
      <div class="field">
        <label for="add-description">Description (optional)</label>
        <textarea id="add-description" maxlength="2000" rows="3"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="primary">Add task</button>
      </div>
    </form>

    <div class="feedback">
      <p id="status" role="status"></p>
      <p id="alert" role="alert"></p>
    </div>

    <div id="list-area" class="card list-area" tabindex="-1" data-key="list">
      <p class="list-message loading">Loading tasks...</p>
    </div>
  </main>

  <dialog id="delete-dialog" aria-labelledby="delete-heading" aria-describedby="delete-message">
    <h2 id="delete-heading">Delete task?</h2>
    <p id="delete-message"></p>
    <div class="form-actions">
      <button type="button" id="delete-cancel">Cancel</button>
      <button type="button" id="delete-confirm" class="danger">Delete</button>
    </div>
  </dialog>
</body>
</html>
