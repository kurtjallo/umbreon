<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Umbreon</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1116;
    --side: #12161c;
    --card: #161b22;
    --fg: #e6edf3;
    --dim: #8d96a0;
    --line: #2d333b;
    --ok: #3fb950;
    --bad: #f85149;
    --warn: #d29922;
    --info: #58a6ff;
    --accent: #79c0ff;
    --hover: #1c232c;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --side: #f6f8fa;
      --card: #ffffff;
      --fg: #1f2328;
      --dim: #59636e;
      --line: #d1d9e0;
      --ok: #1a7f37;
      --bad: #cf222e;
      --warn: #9a6700;
      --info: #0969da;
      --accent: #0969da;
      --hover: #eaeef2;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
  code, .mono { font-family: var(--mono); font-size: 0.9em; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h4 { margin: 24px 0 10px; font-size: 11.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  .dim { color: var(--dim); }
  .faint { opacity: .7; }

  .ok { --tone: var(--ok); }
  .bad { --tone: var(--bad); }
  .warn { --tone: var(--warn); }
  .info { --tone: var(--info); }
  .stopped { --tone: color-mix(in srgb, var(--bad) 55%, var(--dim)); }
  .tint { color: var(--tone); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--tone); }
  .anim .pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  .side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--side); border-right: 1px solid var(--line); padding: 18px 12px; }
  .brand { font-weight: 700; font-size: 15px; padding: 0 8px; }
  .conn { margin: 10px 8px 0; font-size: 12px; color: var(--warn); }
  .follow { padding: 6px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--accent); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .follow:hover { background: var(--hover); }
  main .follow { display: block; margin-top: 12px; }
  .runs-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 28px; margin: 14px 0 6px 8px; }
  .runs-head h4 { margin: 0; }
  .runs-head .follow { padding: 2px 8px; font-size: 12px; }
  .run { display: block; width: 100%; text-align: left; padding: 7px 8px; margin-bottom: 3px; border-radius: 7px; border: 1px solid transparent; background: none; color: inherit; font: inherit; cursor: pointer; }
  .run:hover { background: var(--hover); }
  .run[aria-current="true"] { background: var(--card); border-color: var(--line); }
  .run b { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .run small { display: flex; align-items: center; gap: 7px; margin-top: 2px; font-size: 11.5px; }
  .side p { margin: 4px 8px; font-size: 12.5px; }

  main { width: 100%; max-width: 1000px; padding: 24px 32px 56px; }
  .empty { color: var(--dim); padding: 14px 16px; border: 1px dashed var(--line); border-radius: 9px; }
  .chip { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 600; white-space: nowrap; color: var(--tone); background: color-mix(in srgb, var(--tone) 16%, transparent); }
  .chip.small { padding: 0 7px; font-size: 10.5px; }
  .chip .dot { width: 7px; height: 7px; margin-right: 5px; vertical-align: 0; }

  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .head h2 { margin: 0; font-size: 21px; line-height: 1.25; overflow-wrap: anywhere; }
  .sub { margin-top: 4px; color: var(--dim); font: 12px var(--mono); overflow-wrap: anywhere; }
  .totals { display: flex; flex-wrap: wrap; gap: 32px; margin: 18px 0; }
  .totals div { font-size: 11.5px; color: var(--dim); }
  .totals b { display: block; font-size: 17px; font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }
  .stages { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; margin-bottom: 16px; }
  .stage { padding: 7px 9px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); font-size: 13px; font-weight: 600; }
  .stage small { display: block; color: var(--dim); font-size: 11px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .stage.todo { opacity: .45; }
  .stage.done { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }
  .stage.now { border-color: var(--info); box-shadow: inset 0 0 0 1px var(--info); }
  .stage.stuck { border-color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn); }
  .stage.halted { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
  .banner { margin-bottom: 8px; padding: 11px 14px; border-radius: 9px; font-size: 13.5px; background: color-mix(in srgb, var(--tone) 12%, transparent); border: 1px solid color-mix(in srgb, var(--tone) 45%, transparent); }
  .banner b { display: block; margin-bottom: 2px; }
  .reasons { margin-top: 6px; white-space: pre-wrap; font-size: 13px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 500; font-size: 11.5px; }
  td:first-child { white-space: nowrap; }
  th:last-child, td:last-child { width: 100%; }
  .num { padding-left: 22px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  details summary { cursor: pointer; color: var(--dim); font-size: 12px; margin-top: 2px; }
  details ul { margin: 4px 0 2px; padding-left: 18px; }

  .claim { margin-bottom: 18px; }
  .quote { color: var(--dim); font-style: italic; margin-bottom: 6px; }
  .pending { color: var(--dim); font-size: 13px; padding: 9px 14px; margin-bottom: 8px; border: 1px dashed var(--line); border-radius: 9px; }
  .pending code { color: var(--fg); margin-right: 4px; }
  .check { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 16px; padding: 12px 14px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); }
  .check.single { grid-template-columns: minmax(0, 1fr); }
  .ctitle { font-weight: 600; }
  .ctitle code { color: var(--dim); font-weight: 500; margin: 0 6px 0 2px; }
  .icon { display: inline-block; width: 14px; margin-right: 4px; text-align: center; font-weight: 700; }
  .bar { display: flex; gap: 8px; margin: 10px 0 2px; }
  .group { flex: 1 1 0; min-width: 0; }
  .segs { display: flex; gap: 2px; }
  .seg { flex: 1; height: 8px; border-radius: 2px; background: var(--line); }
  .seg.passed { background: var(--ok); }
  .seg.failed { background: var(--bad); }
  .seg.could_not_run { background: var(--warn); }
  .seg.skipped { background: var(--line); opacity: .45; }
  .seg.now { background: var(--info); }
  .group small { display: block; margin-top: 3px; color: var(--dim); font-size: 10.5px; white-space: nowrap; }
  .detail { margin-top: 8px; font-size: 13px; }
  .line { display: grid; grid-template-columns: 86px minmax(0, 1fr); column-gap: 8px; margin-top: 2px; }
  .line .k { color: var(--dim); }
  .line > span:last-child { overflow-wrap: anywhere; }
  .links { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 12px; }
  a, .linkbtn { color: var(--accent); text-decoration: none; }
  a:hover, .linkbtn:hover { text-decoration: underline; }
  .linkbtn { padding: 0; border: 0; background: none; font: inherit; cursor: zoom-in; }
  .minilinks { display: inline-flex; gap: 10px; margin-left: 10px; font-size: 12px; }
  .thumb button { display: block; padding: 0; border: 0; background: none; cursor: zoom-in; }
  .thumb img { display: block; width: 200px; aspect-ratio: 16 / 10; object-fit: contain; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  .thumb small { color: var(--dim); font-size: 11px; }
  .uncovered { margin: 0; padding-left: 18px; color: var(--dim); }
  .uncovered li { margin-bottom: 4px; }

  .zoom { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(0, 0, 0, .82); cursor: zoom-out; }
  .zoom[hidden] { display: none; }
  .zoom img { max-width: 100%; max-height: 100%; border-radius: 6px; }
</style>
</head>
<body>
<aside class="side anim">
  <div class="brand">Umbreon</div>
  <p class="conn" id="conn" role="status" hidden>reconnecting…</p>
  <div id="runs"></div>
</aside>
<main>
  <div id="top"></div>
  <div id="calls"></div>
  <div id="claims"></div>
</main>
<div class="zoom" id="zoom" role="dialog" aria-modal="true" aria-label="Screenshot" tabindex="-1" hidden><img alt="Enlarged screenshot"></div>
<script>
const esc = (value) => String(value).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

// Every value in an h`` template goes through esc unless it is markup that h`` built itself.
// JSON from the server can never be a Markup instance, so data cannot reach the page unescaped.
class Markup { constructor(html) { this.html = html; } }
const part = (v) => v instanceof Markup ? v.html : Array.isArray(v) ? v.map(part).join("") : v == null || v === false ? "" : esc(v);
const h = (strings, ...values) => new Markup(strings.reduce((out, s, i) => out + part(values[i - 1]) + s));

const pad = (n) => String(n).padStart(2, "0");
const clock = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };
const seconds = (ms, digits) => ms >= 60000 ? clock(ms) : `${(ms / 1000).toFixed(digits)} s`;
function words(ms) {
  const s = Math.round(ms / 1000), min = Math.floor(s / 60), sec = s % 60;
  return [min && `${min} min`, (sec || !min) && `${sec} s`].filter(Boolean).join(" ");
}
const tokens = (n) => n < 1000 ? String(n) : `${(n / 1000).toFixed(1)}k`;
const thousands = (n) => n.toLocaleString("en-US");
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
function timeOfDay(iso) {
  const d = new Date(iso);
  return Number.isNaN(d.getTime()) ? "" : `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
const runFile = (runId, path) => `/runs/${encodeURIComponent(runId)}/${path.split("/").map(encodeURIComponent).join("/")}`;

const STAGE_LABEL = { repo: "Repo", look: "Look", sort: "Sort", plan: "Plan", rehearse: "Rehearse", drive: "Drive", baseline: "Baseline" };
const PHASE_LABEL = { given: "setup", when: "action", then: "result" };
const APP_NAME = { old: "the app before the change", new: "the changed app" };
const RUN_STATUS = {
  running: { tone: "info", short: "running", long: "Running", over: false },
  stuck: { tone: "warn", short: "stuck", long: "Stuck", over: false },
  stopped: { tone: "stopped", short: "stopped", long: "Stopped", over: true },
  PROVEN: { tone: "ok", short: "PROVEN", long: "PROVEN", over: true },
  "NOT PROVEN": { tone: "bad", short: "NOT PROVEN", long: "NOT PROVEN", over: true },
};
const LIVE_DOT = h`<span class="dot info pulse"></span>`;
// Glyphs, not emoji: headless Chromium has no emoji font. States missing here have not been driven yet.
const CHECK_ICON = {
  running: LIVE_DOT,
  passed: h`<span class="icon tint ok">✓</span>`,
  failed: h`<span class="icon tint bad">✗</span>`,
  could_not_run: h`<span class="icon tint warn">⊘</span>`,
  evidence_missing: h`<span class="icon tint warn">⊘</span>`,
  interrupted: h`<span class="icon dim">■</span>`,
};
const DRIVEN = new Set(Object.keys(CHECK_ICON));
const FINISHED = new Set(["passed", "failed", "could_not_run", "evidence_missing"]);

let pinned = null;
let source = null;
let lastData = null;

const line = (label, body) => h`<div class="line"><span class="k">${label}</span><span>${body}</span></div>`;
const followButton = h`<button type="button" class="follow" data-follow data-key="follow">Follow latest</button>`;
const noRuns = h`No runs yet. Start one with <code>umbreon verify &lt;case&gt;</code>.`;

function chip(status, text, small) {
  return h`<span class="chip ${RUN_STATUS[status].tone}${small ? " small" : ""}">${status === "running" ? LIVE_DOT : ""}${text}</span>`;
}

function sidebar(runs, shownId) {
  const list = runs.length === 0 ? h`<p class="dim">${noRuns}</p>` : runs.map((run) => h`
    <button type="button" class="run" data-run="${run.runId}" data-key="run:${run.runId}" aria-current="${run.runId === shownId ? "true" : "false"}">
      <b>${run.caseName}</b>
      <small>${chip(run.status, RUN_STATUS[run.status].short, true)}<span class="mono">${clock(run.elapsedMs)}</span><span class="dim">${timeOfDay(run.startedAt)}</span></small>
    </button>`);
  return h`<div class="runs-head"><h4>Runs</h4>${pinned ? followButton : ""}</div>${list}`;
}

function emptyMain(runs) {
  if (runs.length === 0) return h`<p class="empty">${noRuns}</p>`;
  if (pinned) return h`<p class="empty">That run is not in the list any more.</p>${followButton}`;
  return h`<p class="empty">Waiting for news from the newest run.</p>`;
}

function header(view) {
  const facts = [
    view.commit ? `commit ${view.commit.slice(0, 7)}` : "no commit yet",
    view.plan?.sha256 ? `plan ${view.plan.sha256.slice(0, 7)}` : null,
    `started ${timeOfDay(view.startedAt)}`,
  ].filter(Boolean).join(" · ");
  const label = view.status === "stuck" ? `Stuck · no news for ${clock(view.quietMs)}` : RUN_STATUS[view.status].long;
  return h`<div class="head"><div><h2>${view.caseName}</h2><div class="sub">${facts} · <span class="faint">${view.runId}</span></div></div>${chip(view.status, label)}</div>`;
}

function totals(view, checks) {
  const run = checks.filter((check) => FINISHED.has(check.state)).length;
  return h`<div class="totals">
    <div>Elapsed<b>${clock(view.elapsedMs)}</b></div>
    <div>Tokens in / out<b>${tokens(view.totals.inputTokens)} / ${tokens(view.totals.outputTokens)}</b></div>
    <div>Checks<b>${view.plan ? `${run} of ${checks.length} run` : "not planned yet"}</b></div>
  </div>`;
}

function stageFacts(view, stage) {
  const facts = [
    stage.calls > 0 && plural(stage.calls, "call"),
    stage.stage === "look" && view.look && `${plural(view.look.files, "file")}${view.look.truncated ? ", cut short" : ""}`,
  ].filter(Boolean);
  return facts.map((fact) => ` · ${fact}`).join("");
}

function stageNote(view, stage, checks) {
  switch (stage.state) {
    case "done": return `✓ ${seconds(Math.max(stage.ms, 1000), 0)}${stageFacts(view, stage)}`;
    case "now":
      if (stage.stage === "drive") return `check ${checks.filter((check) => DRIVEN.has(check.state)).length} of ${checks.length}`;
      if (stage.stage === "baseline") return `check ${checks.filter((check) => check.baseline !== null).length} of ${checks.length}`;
      return `running · ${clock(stage.ms)}`;
    case "stuck": return `quiet ${clock(view.quietMs)}, limit ${clock(view.quietLimitMs)}`;
    case "halted": return `stopped here · ${clock(stage.ms)}`;
    default: return " ";
  }
}

function stages(view, checks) {
  return h`<div class="stages">${view.stages.map((stage) => h`
    <div class="stage ${stage.state}">${STAGE_LABEL[stage.stage] ?? stage.stage}<small>${stageNote(view, stage, checks)}</small></div>`)}</div>`;
}

function banner(view) {
  const stage = STAGE_LABEL[view.stage] ?? view.stage;
  if (view.status === "stuck") {
    const hung = view.elapsedMs > view.capMs ? " It is already past that limit, so its process may be hung." : "";
    return h`<div class="banner warn"><b>This run looks stuck.</b>No news for ${words(view.quietMs)} while in the ${stage} stage, and that stage is allowed ${words(view.quietLimitMs)} without news. The run stops itself ${words(view.capMs)} after it starts and then says NOT PROVEN.${hung}</div>`;
  }
  if (view.status === "stopped") {
    return h`<div class="banner bad"><b>The run stopped without a verdict.</b>Its process is gone. The last news came during the ${stage} stage at ${timeOfDay(view.lastEventAt)}.</div>`;
  }
  const verdict = view.verdict;
  if (!verdict) return "";
  const { counts } = verdict;
  const missing = counts.evidence_missing > 0 ? `, ${counts.evidence_missing} evidence missing` : "";
  const stopped = stoppedLabel(view);
  return h`<div class="banner ${verdict.kind === "PROVEN" ? "ok" : "bad"}">
    <b>${verdict.kind}${verdict.commit ? ` for ${verdict.commit.slice(0, 7)}` : ""}${stopped ? ` · ${stopped}` : ""}</b>
    ${counts.passed} of ${verdict.total} checks passed, ${counts.failed} failed, ${counts.could_not_run} could not run${missing}.
    ${verdict.reasons.length > 0 ? h`<div class="reasons">${verdict.reasons.map((reason) => h`<div>${reason}</div>`)}</div>` : ""}
  </div>`;
}

/** A run cut off by Ctrl-C or the time cap did not finish, which the verdict alone does not say. Other halts explain themselves in the reasons. */
function stoppedLabel(view) {
  switch (view.verdict?.halt?.reason) {
    case "interrupted": return "Stopped: interrupted";
    case "time_cap": return `Stopped: hit the ${words(view.capMs)} cap`;
    default: return null;
  }
}

const callName = (call) => `${call.purpose[0].toUpperCase()}${call.purpose.slice(1)}, call ${call.n}`;

function callRow(call) {
  const [first, ...rest] = call.problems;
  const result = call.ok ? h`<span class="tint ok">valid reply</span>` : h`
    <span class="tint bad">rejected</span>${first ? h` · ${first}` : ""}
    ${rest.length > 0 ? h`<details data-key="problems:${call.n}"><summary data-key="summary:${call.n}">all ${call.problems.length} problems</summary><ul>${call.problems.map((problem) => h`<li>${problem}</li>`)}</ul></details>` : ""}`;
  return h`<tr><td>${callName(call)}</td><td class="num">${seconds(call.ms, 1)}</td><td class="num">${thousands(call.inputTokens)}</td><td class="num">${thousands(call.outputTokens)}</td><td>${result}</td></tr>`;
}

function aiCalls(view) {
  const pending = view.pendingCall;
  if (view.calls.length === 0 && !pending) return h`<h4>AI calls</h4><p class="dim">${RUN_STATUS[view.status].over ? "No AI calls." : "No AI calls yet."}</p>`;
  return h`<h4>AI calls</h4><table>
    <thead><tr><th>Call</th><th class="num">Time</th><th class="num">Tokens in</th><th class="num">Tokens out</th><th>Result</th></tr></thead>
    <tbody>${view.calls.map(callRow)}${pending ? h`
      <tr><td>${callName(pending)}</td><td class="num">${clock(pending.ms)} …</td><td class="num">—</td><td class="num">—</td><td class="tint warn">waiting for the answer</td></tr>` : ""}</tbody>
  </table>`;
}

function pendingLine(check) {
  switch (check.state) {
    case "rehearsing": return h`${LIVE_DOT}rehearsing on ${APP_NAME[check.rehearsedOn] ?? "the app"}`;
    case "ready": return "ready · works on the app before the change";
    case "kept": return "kept · works on the changed app only, so it needs something this change adds";
    case "not_ready": return h`<span class="tint warn">not ready${check.problem ? ` · ${check.problem}` : ""}</span>`;
    case "interrupted": return "interrupted · the run ended before this check finished";
    default: return "waiting";
  }
}

function stepBar(steps) {
  const groups = ["given", "when", "then"]
    .map((phase) => ({ phase, steps: steps.filter((step) => step.phase === phase) }))
    .filter((group) => group.steps.length > 0);
  return h`<div class="bar">${groups.map((group) => h`
    <div class="group" style="flex-grow: ${group.steps.length}">
      <div class="segs">${group.steps.map((step) => h`<span class="seg ${step.status}${step.status === "now" ? " pulse" : ""}" title="step ${step.n} · ${step.text} · ${step.status.replaceAll("_", " ")}"></span>`)}</div>
      <small>${PHASE_LABEL[group.phase]} ${group.steps.length}</small>
    </div>`)}</div>`;
}

function checkDetail(check, steps) {
  switch (check.state) {
    case "running": {
      const now = steps.find((step) => step.status === "now");
      if (now) return line("Now", h`step ${now.n} of ${steps.length} · <code>${now.text}</code>`);
      const done = steps.filter((step) => step.status !== "todo" && step.status !== "now").length;
      return line("Now", `step ${done + 1} of ${steps.length}`);
    }
    case "failed":
    case "could_not_run": {
      const at = steps.find((step) => step.status === check.state);
      const problem = check.problem && check.problem !== at?.detail ? line("Problem", check.problem) : "";
      if (!at && !problem && check.state === "could_not_run") {
        const done = steps.filter((step) => step.status !== "todo" && step.status !== "now").length;
        return h`<div class="dim">${done === 0 ? "this check never ran" : `the run stopped after step ${done} of ${steps.length}`}</div>`;
      }
      if (!at) return problem;
      return h`${line(check.state === "failed" ? "Failed" : "Could not run", h`step ${at.n} · <code>${at.text}</code>`)}${at.detail ? line("Why", at.detail) : ""}${problem}`;
    }
    case "evidence_missing":
      return h`<div class="tint warn">every step passed, but some evidence is missing</div>${check.problem ? line("Problem", check.problem) : ""}`;
    case "passed":
      return h`<div class="tint ok">all ${steps.length} steps passed</div>`;
    default:
      return h`<div class="dim">the run ended before this check finished</div>`;
  }
}

function baselineLine(runId, baseline) {
  if (!baseline) return "";
  const { step } = baseline;
  const at = step ? ` at step ${step.n}` : "";
  const detail = step?.detail ? h`<span class="dim"> · ${step.detail}</span>` : "";
  let body;
  switch (baseline.state) {
    case "failed": body = h`<span class="tint ok">failed${at} (shows the change matters)</span>${detail}`; break;
    case "passed": body = h`<span class="tint warn">passed too, so this check does not show the change</span>`; break;
    case "could_not_run": body = h`<span class="tint warn">could not run${at}</span>${detail}`; break;
    case "running": body = h`${LIVE_DOT}${step ? `running step ${step.n}` : "running"}`; break;
    default: body = h`<span class="dim">the run ended before this finished</span>`;
  }
  const links = [
    step?.screenshot ? h`<button type="button" class="linkbtn" data-zoom="${runFile(runId, step.screenshot)}" data-key="before-shot:${step.screenshot}">screenshot</button>` : null,
    baseline.video ? h`<a href="${runFile(runId, baseline.video)}" target="_blank" rel="noopener" data-key="before-video:${baseline.video}">video</a>` : null,
  ].filter(Boolean);
  return line("Before", h`${body}${links.length > 0 ? h`<span class="minilinks">${links}</span>` : ""}`);
}

function evidenceLinks(runId, evidence) {
  if (!evidence) return "";
  const at = evidence.videoAtMs;
  const links = [
    // A media fragment makes the browser's video player open at the moment the check stopped.
    [evidence.video, at == null ? "video" : `video at ${clock(at)}`, at == null ? "" : `#t=${(at / 1000).toFixed(1)}`],
    [evidence.trace, "trace", ""],
    [evidence.appLog, "app log", ""],
    [evidence.pageSnapshot, "page snapshot", ""],
  ].filter(([path]) => path);
  if (links.length === 0) return "";
  return h`<div class="links">${links.map(([path, label, fragment]) => h`<a href="${runFile(runId, path)}${fragment}" target="_blank" rel="noopener" data-key="link:${path}">${label}</a>`)}</div>`;
}

function thumbCaption(state, step) {
  if (state === "failed" || state === "could_not_run") return `step ${step}, when it stopped`;
  return state === "running" ? `latest · step ${step}` : `step ${step}`;
}

function checkCard(runId, check) {
  const neverStarted = check.state === "interrupted" && check.steps.every((step) => step.status === "todo");
  if (!DRIVEN.has(check.state) || neverStarted) {
    return h`<div class="pending"><code>${check.id}</code>${check.it}<div>${pendingLine(check)}</div></div>`;
  }
  const steps = check.steps.map((step, i) => ({ ...step, n: i + 1 }));
  const shot = check.latestScreenshot;
  const thumb = shot ? h`
    <div class="thumb">
      <button type="button" data-zoom="${runFile(runId, shot.path)}" data-key="shot:${check.id}" aria-label="Enlarge the screenshot of ${check.id}, step ${shot.step}">
        <img src="${runFile(runId, shot.path)}" alt="Screenshot of ${check.id} at step ${shot.step}" loading="lazy">
      </button>
      <small>${thumbCaption(check.state, shot.step)}</small>
    </div>` : "";
  return h`<div class="check${shot ? "" : " single"}">
    <div>
      <div class="ctitle">${CHECK_ICON[check.state]}<code>${check.id}</code>${check.it}</div>
      ${stepBar(steps)}
      <div class="detail">${checkDetail(check, steps)}${baselineLine(runId, check.baseline)}</div>
      ${evidenceLinks(runId, check.evidence)}
    </div>${thumb}
  </div>`;
}

function claims(view) {
  const plan = view.plan;
  if (!plan) {
    const text = RUN_STATUS[view.status].over ? "No plan was made." : "The claims appear here as soon as the plan is ready.";
    return h`<h4>Claims and checks</h4><div class="pending">${text}</div>`;
  }
  const notChecked = plan.notTestable.length + plan.uncovered.length === 0 ? "" : h`
    <h4>Not checked</h4>
    <ul class="uncovered">${plan.notTestable.map((note) => h`<li><i>“${note.quote}”</i> · ${note.reason}</li>`)}${plan.uncovered.map((sentence) => h`<li>${sentence}</li>`)}</ul>`;
  return h`<h4>Claims and checks</h4>${plan.claims.map((claim) => h`
    <div class="claim">
      <div class="quote">“${claim.quote}”</div>
      ${claim.checks.length > 0 ? claim.checks.map((check) => checkCard(view.runId, check)) : h`<div class="pending">No check covers this claim.</div>`}
    </div>`)}${notChecked}`;
}

// Rewriting a region on every message would close open <details> and drop keyboard focus,
// so a region is only rewritten when its markup changed, and both are carried over by data-key.
const painted = new WeakMap();
function paint(el, markup) {
  if (painted.get(el) === markup.html) return;
  painted.set(el, markup.html);
  const focused = el.contains(document.activeElement) ? document.activeElement.dataset.key : undefined;
  const open = new Set([...el.querySelectorAll("details[open]")].map((node) => node.dataset.key));
  el.innerHTML = markup.html;
  for (const node of el.querySelectorAll("[data-key]")) {
    if (open.has(node.dataset.key)) node.open = true;
    if (node.dataset.key === focused) node.focus();
  }
}

const region = (id) => document.getElementById(id);
function render({ runs, view }) {
  paint(region("runs"), sidebar(runs, view?.runId));
  document.querySelector("main").classList.toggle("anim", view?.status === "running");
  document.title = view ? `${view.caseName} · ${RUN_STATUS[view.status].long} · Umbreon` : "Umbreon";
  if (!view) {
    paint(region("top"), emptyMain(runs));
    paint(region("calls"), h``);
    paint(region("claims"), h``);
    return;
  }
  const checks = view.plan ? view.plan.claims.flatMap((claim) => claim.checks) : [];
  paint(region("top"), h`${header(view)}${totals(view, checks)}${stages(view, checks)}${banner(view)}`);
  paint(region("calls"), aiCalls(view));
  paint(region("claims"), claims(view));
}

const conn = document.getElementById("conn");
function connect() {
  source?.close();
  lastData = null;
  const es = new EventSource(pinned ? "/api/stream?run=" + encodeURIComponent(pinned) : "/api/stream");
  es.onopen = () => { conn.hidden = true; };
  es.onmessage = (e) => {
    conn.hidden = true;
    if (e.data === lastData) return;
    lastData = e.data;
    render(JSON.parse(e.data));
  };
  es.onerror = () => {
    conn.hidden = false;
    // The browser retries a dropped connection itself, but gives up for good after an HTTP error response.
    if (es.readyState === EventSource.CLOSED) setTimeout(() => { if (source === es) connect(); }, 3000);
  };
  source = es;
}

function show(runId) {
  if (runId === pinned) return;
  pinned = runId;
  connect();
}

const zoom = document.getElementById("zoom");
let zoomOpener = null;
function closeZoom() {
  zoom.hidden = true;
  zoomOpener?.focus();
}
document.addEventListener("click", (e) => {
  if (!zoom.hidden) return closeZoom();
  const target = e.target.closest("[data-zoom], [data-follow], [data-run]");
  if (!target) return;
  if (target.dataset.zoom !== undefined) {
    zoomOpener = target;
    zoom.querySelector("img").src = target.dataset.zoom;
    zoom.hidden = false;
    zoom.focus();
  } else if (target.dataset.follow !== undefined) {
    show(null);
  } else {
    show(target.dataset.run);
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !zoom.hidden) closeZoom();
});

connect();
</script>
</body>
</html>
